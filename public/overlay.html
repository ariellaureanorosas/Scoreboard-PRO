<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0">
    <title>Overlay Futsal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="overlay.css">
</head>
<body>
    <!-- MODO PRÉ-JOGO -->
    <div id="preMatchOverlay" class="pre-match-overlay">
        <div class="pre-match-content">
            <div class="pre-match-team pre-match-team-a">
                <img id="preMatchCrestA" src="" alt="Escudo Time A">
                <div class="pre-match-team-name" id="preMatchTeamNameA">TIME A</div>
            </div>
            <div class="pre-match-center">
                <img id="preMatchCompetitionLogo" src="" alt="Logo Competição" class="pre-match-competition-logo">
                <div class="pre-match-competition-name" id="preMatchCompetitionName">COCA-COLA LEAGUE</div>
                <div class="pre-match-competition-subtitle" id="preMatchCompetitionSubtitle"></div>
            </div>
            <div class="pre-match-team pre-match-team-b">
                <img id="preMatchCrestB" src="" alt="Escudo Time B">
                <div class="pre-match-team-name" id="preMatchTeamNameB">TIME B</div>
            </div>
        </div>
    </div>

    <!-- MODO COMPACTO (faixa) -->
    <div id="scoreboardCompact" class="scoreboard position-top">
      <div class="compact-bar">
        <!-- Segmento 1: Badge da competição -->
        <div class="compact-segment compact-badge">
          <img id="competitionLogo" src="" alt="">
        </div>
        <!-- Segmento 2: Cronômetro -->
        <div class="compact-segment compact-clock">
          <span id="timer">20:00</span>
          </div>
          <!-- Segmento 3: Respiro -->
          <div class="compact-segment compact-respiro"></div>
          <!-- Segmento 4: Trave de cor do Time A -->
        <div class="compact-segment compact-team-a-color-bar">
          <div class="compact-team-a-color-top"></div>
          <div class="compact-team-a-color-bottom"></div>
        </div>
        <!-- Segmento 5: Bloco principal do placar -->
        <div class="compact-segment compact-score-block">
          <span class="compact-abbr" id="abbrA">TIM</span>
          <span class="compact-chevron-right">
            <svg viewBox="0 0 10 16" width="10" height="16">
              <polyline points="2,1 8,8 2,15" fill="none" stroke="currentColor" stroke-width="2.5"/>
            </svg>
          </span>
          <span class="compact-goals" id="scoreA">0</span>
          <span class="compact-sep">|</span>
          <span class="compact-goals" id="scoreB">0</span>
          <span class="compact-chevron-left">
            <svg viewBox="0 0 10 16" width="10" height="16">
              <polyline points="8,1 2,8 8,15" fill="none" stroke="currentColor" stroke-width="2.5"/>
            </svg>
          </span>
          <span class="compact-abbr" id="abbrB">TIM</span>
        </div>
        <!-- Segmento 6: Trave de cor do Time B -->
        <div class="compact-segment compact-team-b-color-bar">
          <div class="compact-team-b-color-top"></div>
          <div class="compact-team-b-color-bottom"></div>
        </div>
      </div>

      <!-- Goal Card -->
      <div id="goalCard" class="goal-card hidden">
        <div class="goal-card-bg" id="goalCardBg"></div>
        <img id="goalCardCrest" src="" alt="" class="goal-card-crest">
        <img id="goalCardPhoto" src="" alt="" class="goal-card-photo">
        <div class="goal-card-info">
          <div class="goal-card-chevron">
            <svg viewBox="0 0 10 16">
              <polyline points="2,1 8,8 2,15" fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </div>
          <div class="goal-card-body">
            <div id="goalCardText" class="goal-card-text">GOOOOOL!!!</div>
            <div class="goal-card-row">
              <span class="goal-card-label">Nome:</span>
              <span id="goalCardNameValue" class="goal-card-value"></span>
            </div>
            <div class="goal-card-row">
              <span class="goal-card-label">Posição:</span>
              <span id="goalCardPositionValue" class="goal-card-value"></span>
            </div>
            <div class="goal-card-row">
              <span class="goal-card-label">Gols na partida:</span>
              <span id="goalCardGoalCountValue" class="goal-card-value"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- MODO EXPANDIDO -->
    <div id="scoreboardExpanded" class="scoreboard-expanded position-top">
        <!-- Linha 1: Info do gol (artilheiro + minuto) -->
        <div class="expanded-goal-info" id="expandedGoalInfo">
            <span id="scorersTextA"></span>
            <span id="scorersTextB"></span>
        </div>
        <!-- Divisor decorativo -->
        <div class="expanded-divider"></div>
        <!-- Linha 2: Placar principal -->
        <div class="expanded-main">
            <div class="expanded-crest expanded-crest-a" id="crestContainerA">
                <img id="crestA" src="">
            </div>
            <span class="expanded-team-name expanded-team-name-a" id="expandedNameA">Time A</span>
            <div class="expanded-score-center">
                <svg class="expanded-bracket" viewBox="0 0 10 16">
                    <polyline points="2,1 8,8 2,15" fill="none" stroke="currentColor" stroke-width="2.5"/>
                </svg>
                <span class="expanded-goals" id="expandedScoreA">0</span>
                <span class="expanded-sep">|</span>
                <span class="expanded-goals" id="expandedScoreB">0</span>
                <svg class="expanded-bracket" viewBox="0 0 10 16">
                    <polyline points="8,1 2,8 8,15" fill="none" stroke="currentColor" stroke-width="2.5"/>
                </svg>
            </div>
            <span class="expanded-team-name expanded-team-name-b" id="expandedNameB">Time B</span>
            <div class="expanded-crest expanded-crest-b" id="crestContainerB">
                <img id="crestB" src="">
            </div>
        </div>
        <!-- Linha 3: Faltas -->
        <div class="expanded-fouls">
            <!-- Label -->
            <span class="expanded-fouls-label">FALTAS</span>
            <!-- Time A -->
            <div class="expanded-fouls-side expanded-fouls-side-a">
                <div class="expanded-fouls-dots" id="foulsDotsA">
                    <span class="foul-dot"></span>
                    <span class="foul-dot"></span>
                    <span class="foul-dot"></span>
                    <span class="foul-dot"></span>
                    <span class="foul-dot"></span>
                </div>
                <span class="expanded-fouls-dlp hidden" id="foulsDlpA">DLP 0</span>
            </div>
            <!-- Separador -->
            <span class="fouls-separator"></span>
            <!-- Time B -->
            <div class="expanded-fouls-side expanded-fouls-side-b">
                <span class="expanded-fouls-dlp hidden" id="foulsDlpB">DLP 0</span>
                <div class="expanded-fouls-dots" id="foulsDotsB">
                    <span class="foul-dot"></span>
                    <span class="foul-dot"></span>
                    <span class="foul-dot"></span>
                    <span class="foul-dot"></span>
                    <span class="foul-dot"></span>
                </div>
            </div>
        </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="overlay.js"></script>
    
  </body>
</html>
